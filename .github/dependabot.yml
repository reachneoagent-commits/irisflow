# Weekly pull requests for dependency updates. LiveKit is grouped so client, components and SDK
# move together; the upstream-check workflow also reports them for the launcher.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app/web
    schedule: { interval: weekly }
    groups:
      livekit: { patterns: ["livekit-client", "@livekit/*"] }
  - package-ecosystem: npm
    directory: /app/server
    schedule: { interval: weekly }
  - package-ecosystem: cargo
    directory: /app/desktop
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
